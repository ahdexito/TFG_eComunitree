<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>login</title>
</head>
<body>
    <header>
        <img src="./img/logo transparencia.png" alt="logotipo">
        <h1>eComunitree</h1>
    </header>
    <main>
        <h3>Gestiona tu comunidad de forma fácil y digital.</h3>
        <section>
            <article>
                <form action="#" method="POST">
                    <input type="email" name="email" id="email" placeholder="Correo electrónico">
                    <input type="password" name="password" id="password" placeholder="Contraseña">
                    <div id="recuerdame">
                        <input type="checkbox" name="check" id="check">
                        <label for="check">recuérdame</label>
                    </div>
                    <button type="submit">iniciar sesión</button>
                </form>
            </article>
            
            <article id="registrarse">
                <p>Comunícate, vota, reporta incidencias y mantente al día desde un único lugar.</p>
                <a href="#"><button>registrarse</button></a>
            </article>
        </section>
    </main>
</body>
</html>
