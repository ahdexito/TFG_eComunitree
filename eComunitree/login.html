<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/login/login.css">
    <title>login</title>
</head>
<body>
    <header>
        <img src="./img/logo transparencia.png" alt="logotipo">
        <h1>eComunitree</h1>
    </header>

    <h3>Gestiona tu comunidad de forma fácil y digital.</h3>

    <main>
        <form action="#" method="POST">
            <h2>¡Hola, vecin@!</h2>
            <input type="email" name="email" id="email" placeholder="Correo electrónico">
            <input type="password" name="password" id="password" placeholder="Contraseña">
            <div class="recuerdame">
                <input type="checkbox" name="check" class="check">
                <label for="check">recuérdame</label>
            </div>
            <button type="submit">iniciar sesión</button>
        </form>
        <hr>
        <section class="registrarse">
            <h2>¿Eres nuev@?</h2>
            <p>Comunícate, vota, reporta incidencias y mantente al día desde un único lugar.</p>
            <a href="#"><button>registrarse</button></a>
        </section>
        
    </main>
</body>
</html>
